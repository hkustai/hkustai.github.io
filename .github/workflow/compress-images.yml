name: Optimize member avatars

on:
  push:
    paths:
      - "members/originals/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Optimize avatars from originals
        run: python scripts/optimize_avatars.py

      - name: Refresh roster and preview
        run: |
          python scripts/render_members.py
          python scripts/preview_avatars.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No size improvement; skip commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add members/images members/preview.html data/members.json group.html
          git commit -m "chore: optimize member avatars
          [skip ci]"
          git push
